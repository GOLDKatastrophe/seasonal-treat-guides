name: Report a mistake or missing treat
description: Something on the site doesn't match what Disney is serving.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the guide accurate. The site follows Disney's official
        Disney Eats foodie guides, so a link to where you saw the change helps most.
  - type: input
    id: season
    attributes:
      label: Season
      description: Which guide, e.g. Holiday Treats 2026
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Item and location
      description: The treat and where it's sold, e.g. "Gingerbread Cookie, Jolly Holiday Bakery Cafe"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options:
        - It's missing from the list
        - It's listed but no longer sold
        - Wrong name, description or location
        - Wrong dates
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's right, and where you saw it (a Disney link, the app, or in the park on a given date).
    validations:
      required: false
