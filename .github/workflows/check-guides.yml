name: Check Disney guides

# Weekday evenings. Disney publishes and edits its foodie guides on weekdays,
# 06:00-16:00 Pacific (31 Disneyland guides checked, 2019-2026; none on a
# weekend), so an evening run catches the same day's changes.
#
# Each run (1) looks for new Disneyland guides for the recurring events in
# tools/discover_guides.js and starts watching them, and (2) fingerprints every
# watched guide. Both are free. Claude runs only when a guide is new or has
# changed: it edits the season, or drafts a whole new one, and the result is a
# pull request. Nothing reaches the live site without review.
on:
  schedule:
    - cron: '0 2 * * 2-6'   # Mon-Fri 18:00 PST / 19:00 PDT (02:00 UTC next day)
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the update step even if no guide changed'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a new season is a few hundred items; cap a runaway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fingerprint the guides
        id: guides
        run: node tools/check_guides.js

      # While a bot PR waits for review, don't redraft it every evening: that
      # would rerun Claude on the same changes daily. Merge or close the PR and
      # the next run picks up everything since.
      - name: Decide whether to update
        id: go
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head guides/update --state open --json number --jq length)
          if [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.guides.outputs.changed }}" != "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$open" != "0" ]; then
            echo "::notice::A guide changed, but an update PR is already open; merge or close it first."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Capture what changed
        id: diff
        if: steps.go.outputs.run == 'true'
        run: |
          git add --intent-to-add data/guides/   # so brand-new guide files appear in the diff
          {
            echo 'GUIDE_DIFF<<__EOF__'
            git diff --unified=2 -- data/guides/ | head -c 60000
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Install Claude Code
        if: steps.go.outputs.run == 'true'
        # The official installer tracks current releases; the npm package lags.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update the season data
        if: steps.go.outputs.run == 'true'
        env:
          # Subscription token from `claude setup-token`; expires after a year.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          printf '%s\n\n%s\n' "$(cat tools/update-prompt.md)" "$GUIDE_DIFF" > /tmp/prompt.txt
          # The prompt carries text scraped from Disney's page, so Bash is
          # limited to the build. node/python3 wildcards would allow any code
          # alongside the API key and a push-capable token.
          claude -p "$(cat /tmp/prompt.txt)" \
            --allowedTools 'Read,Edit,Write,Glob,Grep,Bash(make:*),Bash(git diff:*),Bash(git status:*)' \
            --permission-mode acceptEdits

      - name: Verify the build still passes
        if: steps.go.outputs.run == 'true'
        run: make check

      - name: Open a pull request
        if: steps.go.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: guides/update
          base: main
          title: 'Disney guides: ${{ steps.guides.outputs.summary }}'
          commit-message: |
            Update season data from Disney's guide

            ${{ steps.guides.outputs.summary }}

            Drafted by Claude Code from the guide diff.
          body: |
            A Disney foodie guide is new or has changed, so Claude Code has
            updated the season data to match, or drafted a new season.

            **Detected:** ${{ steps.guides.outputs.summary }}

            `make check` passes on this branch. Review the `seasons/*.json`
            diff against the `data/guides/*.txt` diff — the latter is what
            Disney actually published. `CHANGES.md` has a plain-English
            summary. A new season also adds its preview card in `previews/`.

            Merging deploys to treats.kylejgold.com.
          delete-branch: true
          # Assigning the owner and asking for their review makes this a
          # "participating" notification: email and app, on GitHub's defaults.
          assignees: ${{ github.repository_owner }}
          reviewers: ${{ github.repository_owner }}
          labels: ${{ contains(steps.guides.outputs.summary, 'new season') && 'new season' || 'guide update' }}
          add-paths: |
            seasons/
            data/
            previews/
            CHANGES.md

      # A guide that couldn't be fetched, or whose anchors no longer match, is
      # skipped above rather than reported as a change. Fail last so the run
      # goes red without blocking a PR for any guide that did change.
      # Any failure (a guide unreadable, the token expired, the build broken)
      # opens one issue assigned to the owner, so it can't go unnoticed. Later
      # failures comment on it instead of opening more; close it once fixed.
      - name: Raise an issue if this run failed
        if: failure() || steps.guides.outputs.fetch_failures != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILS: ${{ steps.guides.outputs.fetch_failures }}
        run: |
          msg="The guide check failed on $(date -u +%Y-%m-%d). Unreadable guides: ${FAILS:-unknown}. Log: $RUN_URL"
          gh label create "check failing" --color B60205 --force >/dev/null
          n=$(gh issue list --label "check failing" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"
          else
            gh issue create --title "Guide check is failing" --label "check failing" \
              --assignee "${{ github.repository_owner }}" --body "$msg

          Common causes: Disney changed its page layout or blocked the fetch; CLAUDE_CODE_OAUTH_TOKEN expired (it lasts a year; make a new one with \`claude setup-token\`); a season file broke \`make check\`. Close this once a run passes."
          fi

      - name: Fail if a guide couldn't be read
        if: always() && steps.guides.outputs.fetch_failures != '0'
        run: |
          echo "::error::${{ steps.guides.outputs.fetch_failures }} guide(s) could not be read; see 'Fingerprint the guides'."
          exit 1
